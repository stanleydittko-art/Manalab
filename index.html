<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ManaLab — Le Lagon Bioluminescent</title>
  <style>
    /* ========================================================================
       DESIGN SYSTEM — LABORATOIRE TROPICAL BIOLUMINESCENT
       ======================================================================== */
    :root {
      --bg-abyss: #030b14;
      --bg-lagoon: #061b2c;
      --bg-reef: #0a2a40;
      --glass-bg: rgba(9, 24, 38, 0.78);
      --glass-bg-strong: rgba(7, 19, 31, 0.92);
      --glass-border: rgba(56, 224, 214, 0.22);
      --glass-border-hover: rgba(56, 224, 214, 0.55);

      --text-main: #e9f7fa;
      --text-muted: #8cb2c4;
      --text-dim: #5c7f91;

      --accent-cyan: #2ef2e0;
      --accent-teal: #14b8a6;
      --accent-amber: #fbbf24;
      --accent-danger: #fb7185;

      /* Couleurs de rareté */
      --rar-common: #22d39c;
      --rar-common-bg: rgba(34, 211, 156, 0.14);
      --rar-rare: #38bdf8;
      --rar-rare-bg: rgba(56, 189, 248, 0.16);
      --rar-epic: #c084fc;
      --rar-epic-bg: rgba(192, 132, 252, 0.18);
      --rar-legendary: #facc15;
      --rar-legendary-bg: rgba(250, 204, 21, 0.18);

      --radius-sm: 10px;
      --radius-md: 16px;
      --radius-lg: 22px;
      --shadow-card: 0 12px 32px rgba(0, 0, 0, 0.45);
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      min-height: 100%;
      width: 100%;
      overflow-x: hidden;
      font-family: var(--font-sans);
      color: var(--text-main);
      background:
        radial-gradient(circle at 15% 15%, rgba(20, 184, 166, 0.22), transparent 42%),
        radial-gradient(circle at 85% 20%, rgba(56, 189, 248, 0.16), transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(168, 85, 247, 0.15), transparent 50%),
        linear-gradient(175deg, var(--bg-abyss) 0%, var(--bg-lagoon) 52%, #041321 100%);
      background-attachment: fixed;
      line-height: 1.45;
    }

    /* Canvas plein écran pour les bulles bioluminescentes et confettis */
    #fx-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 900;
    }

    /* Conteneur principal */
    .app-shell {
      position: relative;
      z-index: 10;
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px 14px 48px;
    }

    /* ========================================================================
       HUD SUPÉRIEUR
       ======================================================================== */
    .hud-header {
      background: var(--glass-bg-strong);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      box-shadow: var(--shadow-card), 0 0 28px rgba(46, 242, 224, 0.08);
      backdrop-filter: blur(12px);
      margin-bottom: 14px;
    }

    .hud-top-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(46, 242, 224, 0.25), rgba(56, 189, 248, 0.2));
      border: 1px solid rgba(46, 242, 224, 0.5);
      display: grid;
      place-items: center;
      box-shadow: 0 0 18px rgba(46, 242, 224, 0.25);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.18rem;
      font-weight: 800;
      letter-spacing: 0.4px;
      background: linear-gradient(90deg, #fff, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 0.76rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .biome-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 99px;
      background: rgba(46, 242, 224, 0.14);
      border: 1px solid rgba(46, 242, 224, 0.35);
      color: var(--accent-cyan);
      font-weight: 600;
      font-size: 0.7rem;
    }

    .hud-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hud-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .stat-chip {
      background: rgba(4, 15, 25, 0.72);
      border: 1px solid rgba(140, 178, 196, 0.18);
      border-radius: var(--radius-md);
      padding: 9px 12px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      position: relative;
      overflow: hidden;
    }

    .stat-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .stat-sub {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--accent-cyan);
    }

    .mana-strip {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 2px;
    }

    .mana-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 99px;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .mana-raw { background: var(--rar-common-bg); color: var(--rar-common); border: 1px solid rgba(34, 211, 156, 0.35); }
    .mana-pure { background: var(--rar-rare-bg); color: var(--rar-rare); border: 1px solid rgba(56, 189, 248, 0.4); }
    .mana-prismatic { background: var(--rar-epic-bg); color: var(--rar-epic); border: 1px solid rgba(192, 132, 252, 0.45); }

    /* ========================================================================
       NAVIGATION PAR ONGLETS
       ======================================================================== */
    .nav-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      align-items: center;
    }

    .nav-tab {
      position: relative;
      flex: 1 1 110px;
      padding: 11px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      backdrop-filter: blur(8px);
    }

    .nav-tab:hover {
      color: #fff;
      border-color: var(--glass-border-hover);
      transform: translateY(-1px);
    }

    .nav-tab.active {
      background: linear-gradient(135deg, rgba(46, 242, 224, 0.22), rgba(14, 116, 144, 0.35));
      border-color: var(--accent-cyan);
      color: #fff;
      box-shadow: 0 0 18px rgba(46, 242, 224, 0.22);
    }

    .nav-tab.boss-tab {
      background: linear-gradient(135deg, rgba(250, 204, 21, 0.16), rgba(244, 63, 94, 0.18));
      border-color: rgba(250, 204, 21, 0.55);
      color: var(--rar-legendary);
    }

    .nav-tab.boss-tab:hover {
      box-shadow: 0 0 22px rgba(250, 204, 21, 0.3);
      border-color: var(--rar-legendary);
    }

    .nav-tab.boss-tab.won {
      background: linear-gradient(135deg, rgba(34, 211, 156, 0.2), rgba(250, 204, 21, 0.2));
      border-color: var(--rar-common);
      color: #fef08a;
    }

    .tab-badge {
      position: absolute;
      top: -6px;
      right: -4px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 99px;
      background: var(--accent-danger);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      display: grid;
      place-items: center;
      box-shadow: 0 2px 8px rgba(251, 113, 133, 0.55);
      animation: pulseBadge 1.4s infinite;
    }

    .tab-badge.ready {
      background: var(--rar-legendary);
      color: #081520;
      box-shadow: 0 2px 10px rgba(250, 204, 21, 0.65);
    }

    @keyframes pulseBadge {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.14); }
    }

    /* ========================================================================
       BOUTONS & CARTES
       ======================================================================== */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 15px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(46, 242, 224, 0.35);
      background: linear-gradient(180deg, rgba(20, 184, 166, 0.26), rgba(13, 94, 112, 0.42));
      color: #fff;
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease, opacity 0.2s ease;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
      user-select: none;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--accent-cyan);
      box-shadow: 0 6px 18px rgba(46, 242, 224, 0.24);
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn:disabled {
      opacity: 0.42;
      cursor: not-allowed;
      filter: grayscale(0.4);
    }

    .btn-sm { padding: 7px 11px; font-size: 0.78rem; }
    .btn-lg { padding: 13px 20px; font-size: 0.96rem; }

    .btn-primary {
      background: linear-gradient(135deg, #0d9488, #0284c7);
      border-color: var(--accent-cyan);
      box-shadow: 0 4px 18px rgba(46, 242, 224, 0.25);
    }

    .btn-gold {
      background: linear-gradient(135deg, #d97706, #eab308);
      border-color: #fef08a;
      color: #0b1622;
      box-shadow: 0 4px 20px rgba(250, 204, 21, 0.32);
    }

    .btn-purple {
      background: linear-gradient(135deg, #7e22ce, #a855f7);
      border-color: #e9d5ff;
      box-shadow: 0 4px 18px rgba(192, 132, 252, 0.3);
    }

    .btn-danger {
      background: linear-gradient(135deg, #be123c, #e11d48);
      border-color: #fda4af;
      box-shadow: 0 4px 16px rgba(244, 63, 94, 0.32);
    }

    .btn-ghost {
      background: rgba(10, 28, 44, 0.65);
      border-color: rgba(140, 178, 196, 0.25);
      color: var(--text-muted);
    }

    .btn-ghost:hover:not(:disabled) {
      color: #fff;
      border-color: rgba(140, 178, 196, 0.6);
    }

    .panel {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(10px);
      margin-bottom: 16px;
    }

    .panel-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(56, 224, 214, 0.14);
    }

    .panel-title {
      font-size: 1.08rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-desc {
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    .tab-section { display: none; animation: fadeIn 0.22s ease; }
    .tab-section.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ========================================================================
       RARETÉS & EFFET CHROMATIQUE IRIDESCENT
       ======================================================================== */
    .rarity-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .rar-common { color: var(--rar-common); background: var(--rar-common-bg); border: 1px solid rgba(34, 211, 156, 0.4); }
    .rar-rare { color: var(--rar-rare); background: var(--rar-rare-bg); border: 1px solid rgba(56, 189, 248, 0.45); }
    .rar-epic { color: var(--rar-epic); background: var(--rar-epic-bg); border: 1px solid rgba(192, 132, 252, 0.5); }
    .rar-legendary { color: var(--rar-legendary); background: var(--rar-legendary-bg); border: 1px solid rgba(250, 204, 21, 0.55); }

    .type-pill {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 99px;
      font-size: 0.68rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.08);
      color: #cde8f5;
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .chromatic-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 7px;
      border-radius: 99px;
      font-size: 0.68rem;
      font-weight: 900;
      color: #061420;
      background: linear-gradient(90deg, #ff6b9d, #facc15, #2ef2e0, #c084fc, #ff6b9d);
      background-size: 250% 100%;
      animation: chromaFlow 2.6s linear infinite;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.5);
    }

    .chromatic-card {
      position: relative;
      border-color: rgba(250, 204, 21, 0.7) !important;
      box-shadow: 0 0 22px rgba(192, 132, 252, 0.3), inset 0 0 20px rgba(46, 242, 224, 0.14) !important;
    }

    .chromatic-card::before {
      content: "";
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 2px;
      background: linear-gradient(120deg, #ff6b9d, #facc15, #2ef2e0, #a855f7, #ff6b9d);
      background-size: 300% 300%;
      animation: chromaFlow 3.5s linear infinite;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    @keyframes chromaFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 250% 50%; }
    }

    /* ========================================================================
       ONGLET 1 : ENCLOS & RÉSERVE
       ======================================================================== */
    .enclosures-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 14px;
    }

    .enclosure-card {
      background: linear-gradient(165deg, rgba(8, 30, 46, 0.85), rgba(4, 15, 26, 0.92));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      position: relative;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .enclosure-card.unstable {
      border-color: var(--accent-danger);
      box-shadow: 0 0 24px rgba(251, 113, 133, 0.35), inset 0 0 18px rgba(251, 113, 133, 0.12);
      animation: unstablePulse 1.5s ease-in-out infinite;
    }

    @keyframes unstablePulse {
      0%, 100% { box-shadow: 0 0 16px rgba(251, 113, 133, 0.3); }
      50% { box-shadow: 0 0 30px rgba(251, 113, 133, 0.65); }
    }

    .enclosure-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .enclosure-slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .slot-box {
      background: rgba(2, 10, 18, 0.68);
      border: 1px dashed rgba(140, 178, 196, 0.28);
      border-radius: var(--radius-sm);
      padding: 8px 6px;
      min-height: 116px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 4px;
      position: relative;
    }

    .slot-box.filled {
      border-style: solid;
      border-color: rgba(46, 242, 224, 0.28);
      background: rgba(8, 28, 44, 0.78);
    }

    .slot-box.empty-clickable {
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .slot-box.empty-clickable:hover {
      border-color: var(--accent-cyan);
      background: rgba(46, 242, 224, 0.08);
    }

    .creature-svg-sm {
      width: 56px;
      height: 56px;
      display: block;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.45));
      animation: floatGentle 3.2s ease-in-out infinite;
    }

    .creature-svg-md {
      width: 78px;
      height: 78px;
      display: block;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.5));
    }

    .creature-svg-lg {
      width: 132px;
      height: 132px;
      display: block;
      margin: 0 auto;
      filter: drop-shadow(0 10px 24px rgba(46, 242, 224, 0.35));
      animation: floatGentle 2.6s ease-in-out infinite;
    }

    @keyframes floatGentle {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .slot-remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(5, 16, 26, 0.85);
      color: var(--text-muted);
      font-size: 0.72rem;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .slot-remove-btn:hover {
      color: #fff;
      border-color: var(--accent-danger);
      background: rgba(190, 18, 60, 0.8);
    }

    .synergy-banner {
      font-size: 0.78rem;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      background: rgba(46, 242, 224, 0.1);
      border: 1px solid rgba(46, 242, 224, 0.28);
      color: #a5f3fc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .unstable-alert {
      background: rgba(225, 29, 72, 0.22);
      border: 1px solid rgba(251, 113, 133, 0.55);
      border-radius: var(--radius-sm);
      padding: 9px 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.8rem;
      color: #ffe4e6;
    }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
      gap: 10px;
    }

    .specimen-card {
      background: rgba(5, 18, 30, 0.82);
      border: 1px solid rgba(140, 178, 196, 0.22);
      border-radius: var(--radius-md);
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      position: relative;
    }

    /* ========================================================================
       ONGLET 2 : INCUBATEUR & BARRE DE PROBABILITÉS
       ======================================================================== */
    .proba-bar-wrap {
      background: rgba(2, 10, 18, 0.85);
      border: 1px solid rgba(46, 242, 224, 0.3);
      border-radius: var(--radius-md);
      padding: 14px;
      margin-bottom: 14px;
    }

    .proba-bar-track {
      height: 30px;
      width: 100%;
      border-radius: 99px;
      overflow: hidden;
      display: flex;
      background: #04101a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6);
      margin: 10px 0;
    }

    .proba-seg {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.74rem;
      font-weight: 800;
      color: #04121d;
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
      white-space: nowrap;
    }

    .proba-seg.common { background: linear-gradient(90deg, #10b981, #34d399); }
    .proba-seg.rare { background: linear-gradient(90deg, #0284c7, #38bdf8); color: #fff; }
    .proba-seg.epic { background: linear-gradient(90deg, #9333ea, #c084fc); color: #fff; }
    .proba-seg.legendary { background: linear-gradient(90deg, #eab308, #fef08a); color: #1c1403; }

    .proba-legend {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      font-size: 0.82rem;
    }

    .proba-legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.04);
    }

    .mana-selector-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .mana-control {
      background: rgba(4, 15, 26, 0.8);
      border: 1px solid rgba(140, 178, 196, 0.22);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .mana-stepper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .stepper-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: rgba(46, 242, 224, 0.14);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
    }

    .stepper-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .pity-bar-wrap {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .progress-track {
      height: 12px;
      border-radius: 99px;
      background: rgba(2, 10, 18, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      overflow: hidden;
      margin-top: 5px;
    }

    .progress-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.3s ease;
    }

    .incubators-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .incubator-pod {
      background: linear-gradient(170deg, rgba(10, 32, 48, 0.88), rgba(4, 14, 24, 0.94));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .incubator-pod.ready {
      border-color: var(--rar-legendary);
      box-shadow: 0 0 24px rgba(250, 204, 21, 0.28);
    }

    .egg-visual {
      width: 68px;
      height: 68px;
      margin: 0 auto;
      display: block;
    }

    .egg-wobble {
      animation: eggWobble 1.1s ease-in-out infinite;
    }

    @keyframes eggWobble {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-6deg) scale(1.04); }
      75% { transform: rotate(6deg) scale(1.04); }
    }

    /* ========================================================================
       ONGLET 3 : EXERCICES (MANA)
       ======================================================================== */
    .exercise-tiers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 14px;
    }

    .tier-card {
      background: linear-gradient(160deg, rgba(8, 28, 44, 0.88), rgba(3, 13, 22, 0.94));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
    }

    .tier-card.easy { border-color: rgba(34, 211, 156, 0.45); }
    .tier-card.medium { border-color: rgba(56, 189, 248, 0.5); }
    .tier-card.hard { border-color: rgba(192, 132, 252, 0.55); }

    /* ========================================================================
       ONGLET 4 : FUSION RISQUÉE
       ======================================================================== */
    .fusion-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(275px, 1fr));
      gap: 12px;
    }

    .fusion-card {
      background: rgba(6, 20, 33, 0.88);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ========================================================================
       ONGLET 5 : MANADEX
       ======================================================================== */
    .manadex-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
      gap: 12px;
    }

    .dex-card {
      background: rgba(5, 18, 30, 0.86);
      border: 1px solid rgba(140, 178, 196, 0.2);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 7px;
      position: relative;
    }

    .dex-card.locked {
      opacity: 0.55;
      filter: grayscale(0.85);
    }

    .dex-card.locked svg {
      filter: brightness(0.15) contrast(1.4);
    }

    /* ========================================================================
       MODALES & TOASTS
       ======================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 8, 15, 0.8);
      backdrop-filter: blur(7px);
      z-index: 800;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .modal-backdrop.open {
      display: flex;
      animation: fadeIn 0.18s ease;
    }

    .modal-box {
      width: 100%;
      max-width: 520px;
      max-height: 92vh;
      overflow-y: auto;
      background: linear-gradient(165deg, #092033, #04111d);
      border: 1px solid rgba(46, 242, 224, 0.45);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7), 0 0 36px rgba(46, 242, 224, 0.18);
      position: relative;
    }

    .quiz-timer-track {
      height: 10px;
      width: 100%;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      margin: 10px 0 14px;
    }

    .quiz-timer-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--rar-rare));
      transition: width 0.1s linear;
    }

    .quiz-timer-fill.danger {
      background: linear-gradient(90deg, #f43f5e, #fb923c);
    }

    .quiz-question-box {
      background: rgba(3, 12, 22, 0.82);
      border: 1px solid rgba(46, 242, 224, 0.25);
      border-radius: var(--radius-md);
      padding: 16px;
      font-size: 1.08rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 14px;
      color: #fff;
    }

    .quiz-choices {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .quiz-choice-btn {
      padding: 14px 12px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(140, 178, 196, 0.35);
      background: rgba(11, 34, 52, 0.85);
      color: #fff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .quiz-choice-btn:hover:not(:disabled) {
      border-color: var(--accent-cyan);
      background: rgba(20, 184, 166, 0.25);
      transform: translateY(-1px);
    }

    .quiz-choice-btn.correct {
      background: rgba(16, 185, 129, 0.35);
      border-color: var(--rar-common);
      color: #a7f3d0;
    }

    .quiz-choice-btn.wrong {
      background: rgba(225, 29, 72, 0.35);
      border-color: var(--accent-danger);
      color: #fecdd3;
    }

    .quiz-feedback {
      margin-top: 12px;
      padding: 11px 13px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 600;
      display: none;
    }

    .quiz-feedback.show { display: block; }
    .quiz-feedback.ok { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--rar-common); color: #a7f3d0; }
    .quiz-feedback.ko { background: rgba(225, 29, 72, 0.22); border: 1px solid var(--accent-danger); color: #fecdd3; }

    .fusion-spinner-bar {
      height: 18px;
      border-radius: 99px;
      background: #04101a;
      border: 1px solid rgba(192, 132, 252, 0.5);
      overflow: hidden;
      margin: 14px 0;
    }

    .fusion-spinner-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--rar-epic), var(--rar-legendary));
      transition: width 1.4s cubic-bezier(0.25, 0.9, 0.35, 1);
    }

    .toast-stack {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 950;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: min(350px, calc(100vw - 32px));
      pointer-events: none;
    }

    .toast {
      background: rgba(6, 20, 34, 0.94);
      border: 1px solid var(--accent-cyan);
      color: #fff;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      font-weight: 600;
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55);
      animation: slideInToast 0.25s ease;
    }

    .toast.gold { border-color: var(--rar-legendary); color: #fef08a; }
    .toast.danger { border-color: var(--accent-danger); color: #fecdd3; }
    .toast.purple { border-color: var(--rar-epic); color: #f3e8ff; }

    @keyframes slideInToast {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .upgrades-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    .upgrade-pill-btn {
      flex: 1 1 220px;
      justify-content: space-between;
      text-align: left;
    }

    .boss-hp-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 10px 0;
    }

    .boss-heart {
      width: 34px;
      height: 12px;
      border-radius: 99px;
      background: linear-gradient(90deg, #f43f5e, #fbbf24);
      box-shadow: 0 0 10px rgba(244, 63, 94, 0.6);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .boss-heart.lost {
      opacity: 0.18;
      transform: scale(0.85);
    }

    /* Responsive Mobile */
    @media (max-width: 640px) {
      .app-shell { padding: 10px 10px 44px; }
      .enclosure-slots { grid-template-columns: repeat(3, 1fr); gap: 6px; }
      .slot-box { min-height: 104px; padding: 6px 4px; }
      .creature-svg-sm { width: 44px; height: 44px; }
      .quiz-choices { grid-template-columns: 1fr; }
      .nav-tab { flex: 1 1 44%; padding: 9px 8px; font-size: 0.82rem; }
    }
  </style>
</head>
