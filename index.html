<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ManaLab — Le Lagon Bioluminescent</title>
  <meta name="theme-color" content="#04141f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ManaLab">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Canvas FX 60 FPS (bulles bioluminescentes, particules & textes flottants) -->
  <canvas id="fx-canvas"></canvas>

  <div class="app-shell">
    <!-- ======================================================================
         HUD SUPÉRIEUR
         ====================================================================== -->
    <header class="hud-header">
      <div class="hud-top-row">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
              <path d="M16 3L27 9.5V22.5L16 29L5 22.5V9.5L16 3Z" stroke="#2ef2e0" stroke-width="2" fill="rgba(46,242,224,0.16)"/>
              <circle cx="16" cy="16" r="5" fill="#facc15"/>
              <circle cx="16" cy="16" r="8.5" stroke="#38bdf8" stroke-width="1.3" stroke-dasharray="3 3"/>
            </svg>
          </div>
          <div>
            <div class="brand-title">ManaLab — Spécimens Mutants</div>
            <div class="brand-sub">
              <span class="biome-pill">Biome 1 : Le Lagon Bioluminescent</span>
              <span id="hud-victory-badge" style="display:none; color:#facc15; font-weight:700;">★ Gardien Vaincu</span>
            </div>
          </div>
        </div>
        <div class="hud-actions">
          <button id="btn-sound" class="btn btn-sm btn-ghost" title="Activer/Couper le son">🔊 Son : ON</button>
          <button id="btn-reset" class="btn btn-sm btn-ghost" title="Réinitialiser la partie">↺ Reset</button>
        </div>
      </div>

      <div class="hud-stats-grid">
        <div class="stat-chip">
          <div class="stat-label"><span>Éclats d'Énergie</span><span id="hud-prod-rate" class="stat-sub">+0/s</span></div>
          <div class="stat-value"><span id="hud-shards">0</span> <span style="font-size:0.85rem;color:#2ef2e0;">✦</span></div>
        </div>

        <div class="stat-chip">
          <div class="stat-label"><span>Stocks de Mana</span><span style="font-size:0.68rem;color:#8cb2c4;">Brut / Pur / Prism.</span></div>
          <div class="mana-strip">
            <span class="mana-badge mana-raw" title="Mana Brut (Facile)">● <span id="hud-mana-raw">0</span></span>
            <span class="mana-badge mana-pure" title="Mana Pur (Moyen)">◆ <span id="hud-mana-pure">0</span></span>
            <span class="mana-badge mana-prismatic" title="Mana Prismatique (Difficile)">★ <span id="hud-mana-prismatic">0</span></span>
          </div>
        </div>

        <div class="stat-chip">
          <div class="stat-label"><span>Série / Combo</span><span id="hud-chroma-chance" class="stat-sub">Chroma 1%</span></div>
          <div class="stat-value">
            <span>🔥 <span id="hud-streak">0</span></span>
            <span id="hud-streak-bonus" style="font-size:0.75rem;color:#facc15;">(+0% Chroma)</span>
          </div>
        </div>

        <div class="stat-chip">
          <div class="stat-label"><span>ManaDex</span><span id="hud-pity-mini" class="stat-sub">Chance 0%</span></div>
          <div class="stat-value">
            <span id="hud-dex-count">0 / 11</span>
            <span style="font-size:0.75rem;color:#8cb2c4;" id="hud-dex-chroma">(0 🌈)</span>
          </div>
        </div>
      </div>
    </header>

    <!-- ======================================================================
         NAVIGATION PAR ONGLETS
         ====================================================================== -->
    <nav class="nav-bar" role="tablist">
      <button class="nav-tab active" data-tab="enclosures">
        <span>🏝️ Enclos</span>
        <span id="badge-enclosures" class="tab-badge" style="display:none;">!</span>
      </button>
      <button class="nav-tab" data-tab="incubator">
        <span>🥚 Incubateur</span>
        <span id="badge-incubator" class="tab-badge ready" style="display:none;">1</span>
      </button>
      <button class="nav-tab" data-tab="exercises">
        <span>⚡ Exercices (Mana)</span>
      </button>
      <button class="nav-tab" data-tab="fusion">
        <span>🧬 Fusion</span>
        <span id="badge-fusion" class="tab-badge ready" style="display:none;">!</span>
      </button>
      <button class="nav-tab" data-tab="manadex">
        <span>📘 ManaDex</span>
      </button>
      <button id="btn-guardian-tab" class="nav-tab boss-tab" data-action="open-guardian">
        <span>👑 Gardien Alpha</span>
      </button>
    </nav>

    <!-- ======================================================================
         CONTENU DES ONGLETS
         ====================================================================== -->
    <main>
      <section id="tab-enclosures" class="tab-section active"></section>
      <section id="tab-incubator" class="tab-section"></section>
      <section id="tab-exercises" class="tab-section"></section>
      <section id="tab-fusion" class="tab-section"></section>
      <section id="tab-manadex" class="tab-section"></section>
    </main>
  </div>

  <!-- Conteneur de modale dynamique (Quiz, Éclosion, Gardien, Hors-ligne, Reset) -->
  <div id="modal-backdrop" class="modal-backdrop" role="dialog" aria-modal="true">
    <div id="modal-box" class="modal-box"></div>
  </div>

  <!-- Pile de notifications toast -->
  <div id="toast-stack" class="toast-stack"></div>

  <script src="js/1-config.js" defer></script>
  <script src="js/2-data.js" defer></script>
  <script src="js/3-state.js" defer></script>
  <script src="js/4-utils.js" defer></script>
  <script src="js/5-engine.js" defer></script>
  <script src="js/6-bridge.js" defer></script>
  <script src="js/7-fx.js" defer></script>
  <script src="js/8-ui.js" defer></script>
  <script src="js/9-main.js" defer></script>
</body>
</html>
