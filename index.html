    /**
     * Générateurs procéduraux d'exercices pédagogiques (Maths, Pourcentages, Probabilités)
     */
    const ExerciseGenerators = {
      _randInt(min, max) {
        return Math.floor(Math.random() * (max - min + 1)) + min;
      },

      _buildChoices(correctVal, unit, deltas) {
        const set = new Set([correctVal]);
        const pool = [...deltas].sort(() => Math.random() - 0.5);
        for (const d of pool) {
          const candidate = correctVal + d;
          if (candidate > 0 && !set.has(candidate)) set.add(candidate);
          if (set.size === 4) break;
        }
        let guard = 1;
        while (set.size < 4) {
          const fallback = correctVal + guard * 5;
          if (!set.has(fallback)) set.add(fallback);
          guard++;
        }
        const arr = Array.from(set).sort(() => Math.random() - 0.5);
        const suffix = unit || '';
        return {
          choices: arr.map(v => `${v}${suffix}`),
          answerIndex: arr.indexOf(correctVal)
        };
      },

      // FACILE : Calcul mental rapide (additions, soustractions, tables, doubles/moitiés)
      easy() {
        const kind = this._randInt(1, 4);
        let prompt, val, explain, deltas;
        if (kind === 1) {
          const a = this._randInt(14, 58), b = this._randInt(12, 39);
          val = a + b;
          prompt = `Calcul rapide : ${a} + ${b} = ?`;
          explain = `${a} + ${b} = ${val}.`;
          deltas = [-10, -2, -1, 1, 2, 10];
        } else if (kind === 2) {
          const a = this._randInt(45, 95), b = this._randInt(12, 38);
          val = a - b;
          prompt = `Calcul rapide : ${a} − ${b} = ?`;
          explain = `${a} − ${b} = ${val}.`;
          deltas = [-10, -3, -1, 1, 3, 10];
        } else if (kind === 3) {
          const a = this._randInt(4, 9), b = this._randInt(4, 9);
          val = a * b;
          prompt = `Table de multiplication : ${a} × ${b} = ?`;
          explain = `${a} × ${b} = ${val}.`;
          deltas = [-a, -2, 2, a, -b, b];
        } else {
          const half = this._randInt(14, 48);
          const total = half * 2;
          val = half;
          prompt = `Quelle est la moitié de ${total} ?`;
          explain = `La moitié de ${total} est ${total} ÷ 2 = ${val}.`;
          deltas = [-4, -2, -1, 1, 2, 4];
        }
        const { choices, answerIndex } = this._buildChoices(val, '', deltas);
        return { key: `E:${prompt}`, difficulty: 'easy', prompt, choices, answerIndex, explain };
      },

      // MOYEN : Pourcentages simples, multiplications & probabilités de base
      medium() {
        const kind = this._randInt(1, 4);
        let prompt, val, unit = '', explain, deltas;
        if (kind === 1) {
          const pct = [10, 20, 25, 50, 75][this._randInt(0, 4)];
          const base = [40, 60, 80, 120, 160, 200, 240][this._randInt(0, 6)];
          val = (pct * base) / 100;
          prompt = `Calcule ${pct}% de ${base} Éclats :`;
          explain = `${pct}% de ${base} = (${pct} × ${base}) ÷ 100 = ${val}.`;
          deltas = [-15, -10, -5, 5, 10, 20];
        } else if (kind === 2) {
          const a = this._randInt(11, 19), b = this._randInt(4, 8);
          val = a * b;
          prompt = `Un enclos produit ${a} Éclats/s pendant ${b} s. Total ?`;
          explain = `${a} × ${b} = ${val} Éclats.`;
          deltas = [-a, -4, 4, a, -10, 10];
        } else if (kind === 3) {
          const total = [10, 20, 25][this._randInt(0, 2)];
          const fav = this._randInt(2, total - 3);
          val = Math.round((fav / total) * 100);
          unit = '%';
          prompt = `Un bassin contient ${fav} spécimens Rares sur ${total} au total. Probabilité de tirer un Rare ?`;
          explain = `${fav} ÷ ${total} = ${val}%.`;
          deltas = [-15, -10, -5, 5, 10, 15];
        } else {
          const base = [50, 80, 100, 120, 200][this._randInt(0, 4)];
          const pct = [10, 25, 50][this._randInt(0, 2)];
          val = base + (base * pct) / 100;
          prompt = `Une synergie ajoute +${pct}% à une production de ${base}. Nouvelle production ?`;
          explain = `${pct}% de ${base} = ${(base * pct) / 100}, donc ${base} + ${(base * pct) / 100} = ${val}.`;
          deltas = [-20, -10, -5, 5, 10, 20];
        }
        const { choices, answerIndex } = this._buildChoices(val, unit, deltas);
        return { key: `M:${prompt}`, difficulty: 'medium', prompt, choices, answerIndex, explain };
      },

      // DIFFICILE : Probabilités composées, pourcentages inverses, évolutions
      hard() {
        const kind = this._randInt(1, 5);
        let prompt, val, unit = '', explain, deltas;
        if (kind === 1) {
          // Pourcentage inverse : X% d'un nombre vaut Y
          const pct = [20, 25, 40, 50][this._randInt(0, 3)];
          const total = [60, 80, 100, 120, 150, 200][this._randInt(0, 5)];
          const part = (pct * total) / 100;
          val = total;
          prompt = `${pct}% d'une réserve de Mana vaut ${part}. Combien vaut la réserve entière (100%) ?`;
          explain = `Si ${pct}% = ${part}, alors 100% = (${part} × 100) ÷ ${pct} = ${val}.`;
          deltas = [-40, -20, -10, 10, 20, 40];
        } else if (kind === 2) {
          // Événement complémentaire
          const fail = this._randInt(15, 75);
          val = 100 - fail;
          unit = '%';
          prompt = `Une mutation risquée a ${fail}% de risque d'échouer. Quelle est sa probabilité de réussir ?`;
          explain = `Les deux probabilités font 100% : 100% − ${fail}% = ${val}%.`;
          deltas = [-15, -10, -5, 5, 10, 15];
        } else if (kind === 3) {
          // Probabilité d'union (événements incompatibles)
          const epic = this._randInt(8, 24);
          const leg = this._randInt(3, 14);
          val = epic + leg;
          unit = '%';
          prompt = `Un œuf a ${epic}% d'être Épique et ${leg}% d'être Légendaire. Probabilité d'avoir Épique OU Légendaire ?`;
          explain = `Événements incompatibles : ${epic}% + ${leg}% = ${val}%.`;
          deltas = [-8, -4, -2, 2, 4, 8];
        } else if (kind === 4) {
          // Probabilité de 2 événements indépendants (multiples propres)
          const pairs = [[50, 50, 25], [50, 20, 10], [40, 50, 20], [80, 50, 40], [60, 50, 30], [20, 50, 10], [40, 25, 10]];
          const [p1, p2, res] = pairs[this._randInt(0, pairs.length - 1)];
          val = res;
          unit = '%';
          prompt = `Deux tirages indépendants ont ${p1}% et ${p2}% de réussite. Probabilité de réussir les DEUX ?`;
          explain = `On multiplie les probabilités : ${p1}% × ${p2}% = (${p1} × ${p2}) ÷ 100 = ${val}%.`;
          deltas = [-10, -5, 5, 10, 15, 25];
        } else {
          // Pourcentage avancé
          const pairs = [[15, 200, 30], [35, 120, 42], [12, 250, 30], [30, 140, 42], [45, 80, 36], [15, 160, 24]];
          const [pct, base, res] = pairs[this._randInt(0, pairs.length - 1)];
          val = res;
          prompt = `Calcul avancé : combien font ${pct}% de ${base} ?`;
          explain = `${pct}% de ${base} = (${pct} × ${base}) ÷ 100 = ${val}.`;
          deltas = [-12, -6, -3, 3, 6, 12];
        }
        const { choices, answerIndex } = this._buildChoices(val, unit, deltas);
        return { key: `H:${prompt}`, difficulty: 'hard', prompt, choices, answerIndex, explain };
      },

      // FLASH-QUIZ (Répétition espacée : pioche en priorité dans les questions déjà rencontrées)
      flashcard(history) {
        if (history && history.length > 0) {
          // Prioriser les questions ratées ou les plus anciennes
          const sorted = [...history].sort((a, b) => (a.wrongCount > b.wrongCount ? -1 : a.lastSeen - b.lastSeen));
          const topPool = sorted.slice(0, Math.min(4, sorted.length));
          const picked = topPool[Math.floor(Math.random() * topPool.length)];
          return { ...picked.question, isReview: true };
        }
        return { ...this.easy(), isReview: false };
      }
    };

    /* ==========================================================================
       [3. STATE & STORAGE]
       État complet du joueur, sauvegarde localStorage, migration et hors-ligne
       ========================================================================== */
    function createDefaultState() {
      return {
        version: CONFIG.SAVE_VERSION,
        shards: 30,
        totalShardsEarned: 30,
        mana: { raw: 2, pure: 0, prismatic: 0 },
        streak: 0,
        bestStreak: 0,
        pity: 0,
        labBoostLevel: 0,
        soundEnabled: true,
        guardianDefeated: false,
        guardianUnlockedByShards: false,

        // Enclos : 1 débloqué au départ contenant déjà le 1er Tupa Corail
        enclosures: [
          { id: 0, name: 'Bassin du Lagon #1', unlocked: true, unstable: false, slots: ['sp_init_1', null, null] },
          { id: 1, name: 'Bassin Corallien #2', unlocked: false, unstable: false, slots: [null, null, null] },
          { id: 2, name: 'Serre Bioluminescente #3', unlocked: false, unstable: false, slots: [null, null, null] },
          { id: 3, name: 'Sanctuaire Profond #4', unlocked: false, unstable: false, slots: [null, null, null] }
        ],

        // Incubateurs : 1 débloqué au départ
        incubators: [
          { id: 0, unlocked: true, egg: null },
          { id: 1, unlocked: false, egg: null },
          { id: 2, unlocked: false, egg: null }
        ],

        // Tous les spécimens possédés (id unique -> instance)
        specimens: {
          sp_init_1: { uid: 'sp_init_1', speciesId: 'tupa_corail', chromatic: false, enclosureId: 0 }
        },
        nextSpecimenUid: 2,

        // Sélection actuelle de Mana dans l'interface d'incubation
        manaSelection: { raw: 1, pure: 0, prismatic: 0 },

        // ManaDex : { speciesId: { discovered: true, chromatic: false, count: 1 } }
        manadex: {
          tupa_corail: { discovered: true, chromatic: false, count: 1 }
        },

        // Historique des questions vues pour la répétition espacée
        questionHistory: [],
        stats: { exercisesWon: 0, exercisesTotal: 0, eggsHatched: 0, fusionsWon: 0 },

        instabilityTimer: CONFIG.INSTABILITY_INTERVAL_SEC,
        lastSavedAt: Date.now()
      };
    }

    let state = createDefaultState();

    const Storage = {
      offlineReport: null,

      save() {
        try {
          state.lastSavedAt = Date.now();
          localStorage.setItem(CONFIG.SAVE_KEY, JSON.stringify(state));
        } catch (err) {
          console.warn('Sauvegarde locale indisponible :', err);
        }
      },

      load() {
        try {
          const raw = localStorage.getItem(CONFIG.SAVE_KEY);
          if (!raw) {
            state = createDefaultState();
            return;
          }
          const parsed = JSON.parse(raw);
          state = this.migrate(parsed);
          const now = Date.now();
          const elapsedSec = Math.max(0, Math.floor((now - (state.lastSavedAt || now)) / 1000));
          if (elapsedSec >= 10) {
            this.offlineReport = this.applyOfflineProgress(elapsedSec);
          }
        } catch (err) {
          console.warn('Erreur de chargement, nouvelle partie créée :', err);
          state = createDefaultState();
        }
      },

      migrate(saved) {
        const def = createDefaultState();
        if (!saved || typeof saved !== 'object') return def;
        // Fusion sécurisée des clés manquantes en cas d'évolution de version
        const merged = {
          ...def,
          ...saved,
          mana: { ...def.mana, ...(saved.mana || {}) },
          manaSelection: { ...def.manaSelection, ...(saved.manaSelection || {}) },
          stats: { ...def.stats, ...(saved.stats || {}) },
          version: CONFIG.SAVE_VERSION
        };
        if (!Array.isArray(merged.enclosures) || merged.enclosures.length < 4) merged.enclosures = def.enclosures;
        if (!Array.isArray(merged.incubators) || merged.incubators.length < 3) merged.incubators = def.incubators;
        if (!merged.specimens || typeof merged.specimens !== 'object') merged.specimens = def.specimens;
        if (!merged.manadex || typeof merged.manadex !== 'object') merged.manadex = def.manadex;
        if (!Array.isArray(merged.questionHistory)) merged.questionHistory = [];
        return merged;
      },

      applyOfflineProgress(elapsedSec) {
        // Plafond à 8 heures hors-ligne pour équilibrer le jeu pédagogique
        const cappedSec = Math.min(elapsedSec, 8 * 3600);
        // Avancer les œufs en cours
        let eggsReady = 0;
        for (const inc of state.incubators) {
          if (inc.egg && inc.egg.remainingSec > 0) {
            inc.egg.remainingSec = Math.max(0, inc.egg.remainingSec - cappedSec);
            if (inc.egg.remainingSec === 0) eggsReady++;
          }
        }
        // Calculer une estimation propre de production hors-ligne (sans dépendre d'Engine)
        const boostMult = 1 + state.labBoostLevel * 0.20;
        let rate = 0;
        for (const enc of state.enclosures) {
          if (!enc.unlocked) continue;
          let encBase = 0;
          for (const uid of enc.slots) {
            if (!uid) continue;
            const sp = state.specimens[uid];
            const def = sp && SPECIES[sp.speciesId];
            if (def) encBase += def.prod * (sp.chromatic ? CONFIG.CHROMATIC_PROD_MULT : 1);
          }
          if (enc.unstable) encBase *= CONFIG.INSTABILITY_PENALTY;
          rate += encBase * boostMult;
        }
        const gained = Math.floor(rate * cappedSec);
        if (gained <= 0 && eggsReady === 0) return null;
        state.shards += gained;
        state.totalShardsEarned += gained;
        return { elapsedSec: cappedSec, gained, eggsReady };
      },

      reset() {
        try { localStorage.removeItem(CONFIG.SAVE_KEY); } catch (e) {}
        state = createDefaultState();
        this.save();
      }
    };

    /* ==========================================================================
       [4. UTILS & AUDIO]
       Fonctions utilitaires (RNG pondéré, formatage) et synthétiseur Web Audio
       ========================================================================== */
    const Utils = {
      formatNum(n) {
        if (!isFinite(n)) return '0';
        if (n >= 1e6) return (n / 1e6).toFixed(2).replace(/\.00$/, '') + 'M';
        if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
        return Math.floor(n).toString();
      },

      formatDuration(sec) {
        const s = Math.max(0, Math.ceil(sec));
        if (s < 60) return `${s}s`;
        const m = Math.floor(s / 60);
        const rem = s % 60;
        if (m < 60) return `${m}m ${rem}s`;
        const h = Math.floor(m / 60);
        return `${h}h ${m % 60}m`;
      },

      /**
       * Tirage aléatoire pondéré : oddsTable = { key: weight, ... }
       */
      rollWeighted(oddsTable) {
        const entries = Object.entries(oddsTable).filter(([, w]) => w > 0);
        const total = entries.reduce((acc, [, w]) => acc + w, 0);
        let r = Math.random() * total;
        for (const [key, w] of entries) {
          r -= w;
          if (r <= 0) return key;
        }
        return entries[entries.length - 1][0];
      },

      randomOf(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }
    };

    const AudioFX = {
      ctx: null,

      _ensureCtx() {
        if (!state.soundEnabled) return null;
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      },

      _tone(freq, dur, type = 'sine', gainVal = 0.12, delay = 0, freqEnd = null) {
        const ctx = this._ensureCtx();
        if (!ctx) return;
        const now = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (freqEnd) osc.frequency.exponentialRampToValueAtTime(freqEnd, now + dur);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(gainVal, now + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0008, now + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + dur + 0.02);
      },

      play(id) {
        try {
          switch (id) {
            case 'click':
              this._tone(540, 0.06, 'sine', 0.06, 0, 720);
              break;
            case 'correct':
              this._tone(523.25, 0.12, 'triangle', 0.12, 0);
              this._tone(659.25, 0.12, 'triangle', 0.12, 0.08);
              this._tone(783.99, 0.22, 'triangle', 0.13, 0.16);
              break;
            case 'wrong':
              this._tone(260, 0.16, 'sawtooth', 0.08, 0, 180);
              this._tone(180, 0.24, 'sawtooth', 0.08, 0.14, 130);
              break;
            case 'incubate':
              this._tone(300, 0.22, 'sine', 0.1, 0, 520);
              this._tone(440, 0.26, 'triangle', 0.08, 0.12, 660);
              break;
            case 'alert':
              this._tone(660, 0.12, 'sine', 0.09, 0);
              this._tone(520, 0.18, 'sine', 0.09, 0.14);
              break;
            case 'fuse_charge':
              this._tone(220, 1.25, 'triangle', 0.1, 0, 780);
              break;
            case 'hatch_common':
              this._tone(440, 0.12, 'triangle', 0.11, 0);
              this._tone(554, 0.18, 'triangle', 0.11, 0.09);
              break;
            case 'hatch_rare':
              [523, 659, 784, 1046].forEach((f, i) => this._tone(f, 0.18, 'triangle', 0.12, i * 0.07));
              break;
            case 'hatch_epic':
              [440, 554, 659, 880, 1108].forEach((f, i) => this._tone(f, 0.24, 'triangle', 0.13, i * 0.07));
              break;
            case 'hatch_legendary':
              [523, 659, 784, 1046, 1318, 1568].forEach((f, i) => this._tone(f, 0.34, 'triangle', 0.14, i * 0.08));
              this._tone(261.6, 0.7, 'sine', 0.12, 0.1);
              break;
            case 'chromatic':
              [1046, 1318, 1568, 2093].forEach((f, i) => this._tone(f, 0.2, 'sine', 0.1, 0.12 + i * 0.06));
              break;
          }
        } catch (e) {}
      }
    };

    /* ==========================================================================
       [5. ENGINE & PROBA]
       Logique métier pure (ZÉRO référence au DOM) : probabilités, incubation,
       Surcharge Stop ou Encore, synergies, instabilité ADN et Fusion Risquée
       ========================================================================== */
    const ProbaEngine = {
      /**
       * Calcule les probabilités exactes Commun/Rare/Épique/Légendaire selon les
       * doses de Mana injectées et l'état de la Jauge de Chance Garantie (Pity).
       */
      computeOdds(manaSelection, options = {}) {
        const usePity = options.ignorePity ? false : (state.pity >= CONFIG.PITY_THRESHOLD);
        if (usePity) {
          return { common: 0, rare: 0, epic: 75, legendary: 25, pityTriggered: true };
        }

        let { common, rare, epic, legendary } = CONFIG.BASE_ODDS;
        const sel = manaSelection || { raw: 0, pure: 0, prismatic: 0 };

        const applyShift = (count, shift) => {
          for (let i = 0; i < count; i++) {
            // Priorité : retirer des Communs ; si Communs insuffisants, puiser dans Rare
            let pulled = Math.min(common, shift.pullCommon);
            common -= pulled;
            const leftover = shift.pullCommon - pulled;
            if (leftover > 0) {
              const fromRare = Math.min(Math.max(0, rare - 5), leftover);
              rare -= fromRare;
              pulled += fromRare;
            }
            const totalAdd = shift.addRare + shift.addEpic + shift.addLegendary;
            if (pulled > 0 && totalAdd > 0) {
              const ratio = pulled / totalAdd;
              rare += shift.addRare * ratio;
              epic += shift.addEpic * ratio;
              legendary += shift.addLegendary * ratio;
            }
          }
        };

        applyShift(sel.raw || 0, CONFIG.MANA_SHIFTS.raw);
        applyShift(sel.pure || 0, CONFIG.MANA_SHIFTS.pure);
        applyShift(sel.prismatic || 0, CONFIG.MANA_SHIFTS.prismatic);

        // Normalisation stricte à 100.0%
        const sum = common + rare + epic + legendary;
        common = Math.round((common / sum) * 1000) / 10;
        rare = Math.round((rare / sum) * 1000) / 10;
        epic = Math.round((epic / sum) * 1000) / 10;
        legendary = Math.max(0, Math.round((100 - common - rare - epic) * 10) / 10);

        return { common, rare, epic, legendary, pityTriggered: false };
      },

      /**
       * Calcule les nouvelles probabilités si la Surcharge "Stop ou Encore" réussit :
       * supprime la rareté minimale disponible et booste fortement Épique & Légendaire.
       */
      computeOverchargedOdds(baseOdds) {
        let { common, rare, epic, legendary } = baseOdds;
        if (common > 0) {
          // Supprime 100% des Communs et redistribue vers Rare / Épique / Légendaire
          const pool = common;
          common = 0;
          rare += pool * 0.35;
          epic += pool * 0.42;
          legendary += pool * 0.23;
        } else if (rare > 0) {
          // Déjà 0% Commun -> supprime Rare pour garantir Épique ou Légendaire !
          const pool = rare;
          rare = 0;
          epic += pool * 0.62;
          legendary += pool * 0.38;
        } else {
          // Déjà Épique/Légendaire -> boost massif Légendaire
          const shift = epic * 0.5;
          epic -= shift;
          legendary += shift;
        }
        const sum = common + rare + epic + legendary;
        common = Math.round((common / sum) * 1000) / 10;
        rare = Math.round((rare / sum) * 1000) / 10;
        epic = Math.round((epic / sum) * 1000) / 10;
        legendary = Math.max(0, Math.round((100 - common - rare - epic) * 10) / 10);
        return { common, rare, epic, legendary, overcharged: true };
      },

      getChromaticChance() {
        return Math.min(
          CONFIG.MAX_CHROMATIC_CHANCE,
          CONFIG.CHROMATIC_CHANCE + state.streak * CONFIG.STREAK_CHROMATIC_BONUS
        );
      },

      rollSpeciesByRarity(rarity) {
        const pool = SPECIES_LIST.filter(s => s.rarity === rarity);
        return Utils.randomOf(pool);
      }
    };

    const GameEngine = {
      listeners: [],

      onEvent(fn) {
        this.listeners.push(fn);
      },

      emit(type, payload = {}) {
        for (const fn of this.listeners) fn(type, payload);
      },

      // --- Spécimens & ManaDex ---
      createSpecimen(speciesId, chromatic) {
        const uid = 'sp_' + state.nextSpecimenUid++;
        const sp = { uid, speciesId, chromatic: !!chromatic, enclosureId: null };
        state.specimens[uid] = sp;
        if (!state.manadex[speciesId]) {
          state.manadex[speciesId] = { discovered: true, chromatic: !!chromatic, count: 1 };
        } else {
          state.manadex[speciesId].discovered = true;
          state.manadex[speciesId].count += 1;
          if (chromatic) state.manadex[speciesId].chromatic = true;
        }
        return sp;
      },

      getDiscoveredCount() {
        return Object.values(state.manadex).filter(e => e.discovered).length;
      },

      getChromaticDiscoveredCount() {
        return Object.values(state.manadex).filter(e => e.chromatic).length;
      },

      getReserveSpecimens() {
        return Object.values(state.specimens).filter(s => s.enclosureId === null);
      },

      // --- Enclos & Synergies ---
      computeEnclosureStats(enc) {
        const creatures = enc.slots.map(uid => (uid ? state.specimens[uid] : null)).filter(Boolean);
        const typesSet = new Set(creatures.map(c => SPECIES[c.speciesId].type));
        let activeSynergy = null;
        for (const syn of SYNERGIES) {
          if (syn.types.every(t => typesSet.has(t))) {
            activeSynergy = syn;
            break;
          }
        }
        let baseProd = 0;
        let chromaCount = 0;
        for (const c of creatures) {
          const def = SPECIES[c.speciesId];
          baseProd += def.prod * (c.chromatic ? CONFIG.CHROMATIC_PROD_MULT : 1);
          if (c.chromatic) chromaCount++;
        }
        const synBonus = activeSynergy ? activeSynergy.bonus : 0;
        const chromaAura = chromaCount * CONFIG.CHROMATIC_AURA_BONUS;
        const labMult = 1 + state.labBoostLevel * 0.20;
        const unstableMult = enc.unstable ? CONFIG.INSTABILITY_PENALTY : 1;
        const finalProd = baseProd * (1 + synBonus + chromaAura) * labMult * unstableMult;
        return { creatures, activeSynergy, synBonus, chromaAura, labMult, unstableMult, finalProd };
      },

      getTotalProductionPerSec() {
        return state.enclosures
          .filter(e => e.unlocked)
          .reduce((sum, enc) => sum + this.computeEnclosureStats(enc).finalProd, 0);
      },

      assignSpecimenToEnclosure(uid, enclosureId) {
        const sp = state.specimens[uid];
        const enc = state.enclosures[enclosureId];
        if (!sp || !enc || !enc.unlocked) return false;
        const emptyIdx = enc.slots.indexOf(null);
        if (emptyIdx === -1) return false;
        // Retirer d'un autre enclos si nécessaire
        if (sp.enclosureId !== null) this.removeSpecimenFromEnclosure(uid);
        enc.slots[emptyIdx] = uid;
        sp.enclosureId = enclosureId;
        this.emit('stateChanged', { areas: ['enclosures', 'hud', 'fusion'] });
        return true;
      },

      removeSpecimenFromEnclosure(uid) {
        const sp = state.specimens[uid];
        if (!sp || sp.enclosureId === null) return false;
        const enc = state.enclosures[sp.enclosureId];
        if (enc) {
          const idx = enc.slots.indexOf(uid);
          if (idx !== -1) enc.slots[idx] = null;
          // Si l'enclos devient vide, il n'est plus instable
          if (enc.slots.every(s => s === null)) enc.unstable = false;
        }
        sp.enclosureId = null;
        this.emit('stateChanged', { areas: ['enclosures', 'hud', 'fusion'] });
        return true;
      },

      unlockEnclosure(enclosureId) {
        const enc = state.enclosures[enclosureId];
        const cost = CONFIG.ENCLOSURE_COSTS[enclosureId];
        if (!enc || enc.unlocked || state.shards < cost) return false;
        state.shards -= cost;
        enc.unlocked = true;
        AudioFX.play('correct');
        this.emit('toast', { text: `🏝️ ${enc.name} débloqué !`, tone: 'gold' });
        this.emit('stateChanged', { areas: ['enclosures', 'hud'] });
        return true;
      },

      buyLabBoost() {
        const cost = CONFIG.LAB_BOOST_COSTS[state.labBoostLevel];
        if (cost === undefined || state.shards < cost) return false;
        state.shards -= cost;
        state.labBoostLevel++;
        AudioFX.play('correct');
        this.emit('toast', { text: `🔬 Amplificateur ManaLab Niv.${state.labBoostLevel} (+${state.labBoostLevel * 20}% prod.) !`, tone: 'gold' });
        this.emit('stateChanged', { areas: ['enclosures', 'hud'] });
        return true;
      },

      stabilizeEnclosure(enclosureId) {
        const enc = state.enclosures[enclosureId];
        if (!enc || !enc.unstable) return;
        enc.unstable = false;
        const bonus = Math.max(25, Math.round(this.computeEnclosureStats(enc).finalProd * 6));
        state.shards += bonus;
        state.totalShardsEarned += bonus;
        this.emit('fx', { kind: 'burst', rarity: 'rare' });
        this.emit('toast', { text: `🧬 ${enc.name} stabilisé ! +${Utils.formatNum(bonus)} Éclats bonus`, tone: 'cyan' });
        this.emit('stateChanged', { areas: ['enclosures', 'hud', 'nav'] });
      },

      // --- Incubation & Stop ou Encore ---
      adjustManaSelection(manaType, delta) {
        const cur = state.manaSelection[manaType] || 0;
        const total = state.manaSelection.raw + state.manaSelection.pure + state.manaSelection.prismatic;
        const next = cur + delta;
        if (next < 0) return;
        if (delta > 0 && (next > state.mana[manaType] || total >= CONFIG.MAX_MANA_PER_EGG)) return;
        state.manaSelection[manaType] = next;
        AudioFX.play('click');
        this.emit('stateChanged', { areas: ['incubator'] });
      },

      unlockIncubator(incId) {
        const inc = state.incubators[incId];
        const cost = CONFIG.INCUBATOR_COSTS[incId];
        if (!inc || inc.unlocked || state.shards < cost) return false;
        state.shards -= cost;
        inc.unlocked = true;
        AudioFX.play('correct');
        this.emit('toast', { text: `🥚 Incubateur #${incId + 1} activé !`, tone: 'gold' });
        this.emit('stateChanged', { areas: ['incubator', 'hud'] });
        return true;
      },

      startIncubation() {
        const freeInc = state.incubators.find(i => i.unlocked && !i.egg);
        if (!freeInc) return { ok: false, msg: 'Aucun incubateur libre.' };

        const sel = state.manaSelection;
        const totalDoses = sel.raw + sel.pure + sel.prismatic;
        if (totalDoses <= 0) return { ok: false, msg: 'Injecte au moins 1 dose de Mana.' };
        if (sel.raw > state.mana.raw || sel.pure > state.mana.pure || sel.prismatic > state.mana.prismatic) {
          return { ok: false, msg: 'Stock de Mana insuffisant.' };
        }

        // Consommer le Mana
        state.mana.raw -= sel.raw;
        state.mana.pure -= sel.pure;
        state.mana.prismatic -= sel.prismatic;

        const odds = ProbaEngine.computeOdds(sel);
        const duration = Math.round(CONFIG.INCUBATION_BASE_SEC + totalDoses * CONFIG.INCUBATION_PER_MANA_SEC);
        freeInc.egg = {
          durationSec: duration,
          remainingSec: duration,
          odds,
          overchargeTried: false,
          overchargeWon: false
        };

        // Réajuster la sélection pour ne pas dépasser le stock restant
        state.manaSelection.raw = Math.min(state.manaSelection.raw, state.mana.raw);
        state.manaSelection.pure = Math.min(state.manaSelection.pure, state.mana.pure);
        state.manaSelection.prismatic = Math.min(state.manaSelection.prismatic, state.mana.prismatic);

        AudioFX.play('incubate');
        this.emit('stateChanged', { areas: ['incubator', 'hud', 'nav'] });
        return { ok: true, incubatorId: freeInc.id };
      },

      accelerateEgg(incId) {
        const inc = state.incubators[incId];
        if (!inc || !inc.egg || inc.egg.remainingSec <= 0) return;
        inc.egg.remainingSec = 0;
        this.emit('toast', { text: '⚡ Incubation terminée instantanément !', tone: 'gold' });
        this.emit('stateChanged', { areas: ['incubator', 'nav'] });
      },

      applyOverchargeResult(incId, won) {
        const inc = state.incubators[incId];
        if (!inc || !inc.egg) return null;
        inc.egg.overchargeTried = true;
        if (won) {
          inc.egg.overchargeWon = true;
          inc.egg.odds = ProbaEngine.computeOverchargedOdds(inc.egg.odds);
        } else {
          inc.egg.overchargeWon = false;
          inc.egg.odds = { ...CONFIG.BASE_ODDS, pityTriggered: false, overcharged: false };
        }
        this.emit('stateChanged', { areas: ['incubator'] });
        return inc.egg.odds;
      },

      hatchEgg(incId) {
        const inc = state.incubators[incId];
        if (!inc || !inc.egg || inc.egg.remainingSec > 0) return null;
        const odds = inc.egg.odds;
        const rarity = Utils.rollWeighted({
          common: odds.common,
          rare: odds.rare,
          epic: odds.epic,
          legendary: odds.legendary
        });

        const chromatic = Math.random() < ProbaEngine.getChromaticChance();
        const speciesDef = ProbaEngine.rollSpeciesByRarity(rarity);
        const isNewDiscovery = !state.manadex[speciesDef.id]?.discovered;

        // Mise à jour de la Jauge de Chance Garantie (Pity)
        if (odds.pityTriggered || rarity === 'epic' || rarity === 'legendary') {
          state.pity = 0;
        } else if (rarity === 'common') {
          state.pity = Math.min(CONFIG.PITY_THRESHOLD, state.pity + CONFIG.PITY_STEP);
        }

        const specimen = this.createSpecimen(speciesDef.id, chromatic);
        state.stats.eggsHatched++;
        inc.egg = null;

        // Placer automatiquement s'il y a une place libre dans un enclos débloqué
        let autoPlacedEnc = null;
        for (const enc of state.enclosures) {
          if (enc.unlocked && enc.slots.includes(null)) {
            this.assignSpecimenToEnclosure(specimen.uid, enc.id);
            autoPlacedEnc = enc.name;
            break;
          }
        }

        AudioFX.play('hatch_' + rarity);
        if (chromatic) AudioFX.play('chromatic');
        this.emit('fx', { kind: 'burst', rarity, chromatic });
        this.emit('stateChanged', { areas: ['incubator', 'enclosures', 'fusion', 'manadex', 'hud', 'nav'] });

        return { specimen, speciesDef, rarity, chromatic, isNewDiscovery, autoPlacedEnc };
      },

      // --- Exercices & Récompenses Mana ---
      recordQuestionResult(question, isCorrect) {
        state.stats.exercisesTotal++;
        if (isCorrect) {
          state.stats.exercisesWon++;
          state.streak++;
          if (state.streak > state.bestStreak) state.bestStreak = state.streak;
        } else {
          state.streak = 0;
        }

        // Enregistrer dans l'historique de répétition espacée
        const existing = state.questionHistory.find(h => h.key === question.key);
        if (existing) {
          existing.lastSeen = Date.now();
          if (isCorrect) existing.correctCount++;
          else existing.wrongCount++;
        } else {
          state.questionHistory.push({
            key: question.key,
            question,
            correctCount: isCorrect ? 1 : 0,
            wrongCount: isCorrect ? 0 : 1,
            lastSeen: Date.now()
          });
          if (state.questionHistory.length > 35) state.questionHistory.shift();
        }
        this.emit('stateChanged', { areas: ['hud', 'incubator'] });
      },

      grantExerciseReward(difficulty) {
        const map = { easy: 'raw', medium: 'pure', prismatic: 'prismatic', hard: 'prismatic' };
        const manaKey = map[difficulty] || 'raw';
        // Bonus de série : +1 dose supplémentaire tous les 3 combos
        const bonusDose = (state.streak > 0 && state.streak % 3 === 0) ? 1 : 0;
        const gained = 1 + bonusDose;
        state.mana[manaKey] += gained;

        // Petit gain d'Éclats immédiat pour renforcer le plaisir
        const shardBonus = difficulty === 'hard' ? 35 : (difficulty === 'medium' ? 18 : 8);
        state.shards += shardBonus;
        state.totalShardsEarned += shardBonus;

        // Sélectionner automatiquement si la sélection était à 0
        const selTotal = state.manaSelection.raw + state.manaSelection.pure + state.manaSelection.prismatic;
        if (selTotal === 0) state.manaSelection[manaKey] = 1;

        this.emit('fx', { kind: 'floatText', text: `+${gained} Mana` + (bonusDose ? ' (Combo!)' : '') });
        this.emit('stateChanged', { areas: ['hud', 'incubator', 'exercises'] });
        return { manaKey, gained, shardBonus, bonusDose };
      },

      // --- Fusion Risquée ---
      getFusableGroups() {
        const reserve = this.getReserveSpecimens();
        const groups = {};
        for (const sp of reserve) {
          const def = SPECIES[sp.speciesId];
          if (def.rarity === 'legendary') continue;
          if (!groups[sp.speciesId]) groups[sp.speciesId] = [];
          groups[sp.speciesId].push(sp);
        }
        return Object.entries(groups)
          .filter(([, list]) => list.length >= 2)
          .map(([speciesId, list]) => ({ speciesDef: SPECIES[speciesId], list }));
      },

      executeFusion(speciesId, mode) {
        const countNeeded = mode === 'safe' ? CONFIG.FUSION_SAFE_COUNT : CONFIG.FUSION_RISKY_COUNT;
        const pool = this.getReserveSpecimens().filter(s => s.speciesId === speciesId);
        if (pool.length < countNeeded) return { ok: false, msg: 'Spécimens insuffisants en réserve.' };

        const srcDef = SPECIES[speciesId];
        const nextIdx = CONFIG.RARITY_ORDER.indexOf(srcDef.rarity) + 1;
        if (nextIdx >= CONFIG.RARITY_ORDER.length) return { ok: false, msg: 'Rareté maximale atteinte.' };
        const targetRarity = CONFIG.RARITY_ORDER[nextIdx];

        const success = mode === 'safe' ? true : (Math.random() < CONFIG.FUSION_RISKY_CHANCE);
        // Privilégier la consommation des non-chromatiques en premier
        pool.sort((a, b) => Number(a.chromatic) - Number(b.chromatic));

        if (success) {
          const consumed = pool.slice(0, countNeeded);
          const hadChromatic = consumed.some(c => c.chromatic);
          for (const c of consumed) delete state.specimens[c.uid];

          const chromatic = hadChromatic || (Math.random() < ProbaEngine.getChromaticChance());
          const newDef = ProbaEngine.rollSpeciesByRarity(targetRarity);
          const isNewDiscovery = !state.manadex[newDef.id]?.discovered;
          const created = this.createSpecimen(newDef.id, chromatic);
          state.stats.fusionsWon++;

          AudioFX.play('hatch_' + targetRarity);
          if (chromatic) AudioFX.play('chromatic');
          this.emit('fx', { kind: 'burst', rarity: targetRarity, chromatic });
          this.emit('stateChanged', { areas: ['fusion', 'enclosures', 'manadex', 'hud', 'nav'] });
          return { ok: true, success: true, created, newDef, targetRarity, chromatic, isNewDiscovery };
        } else {
          // Échec de fusion risquée (35%) : 1 spécimen est perdu, l'autre survit
          const lost = pool[0];
          delete state.specimens[lost.uid];
          AudioFX.play('wrong');
          this.emit('stateChanged', { areas: ['fusion', 'enclosures', 'hud', 'nav'] });
          return { ok: true, success: false, lostDef: srcDef };
        }
      },

      // --- Gardien Alpha ---
      canChallengeGuardian() {
        return this.getDiscoveredCount() >= CONFIG.GUARDIAN_SPECIES_REQ || state.guardianUnlockedByShards;
      },

      unlockGuardianWithShards() {
        if (state.shards < CONFIG.GUARDIAN_SHARD_BYPASS) return false;
        state.shards -= CONFIG.GUARDIAN_SHARD_BYPASS;
        state.guardianUnlockedByShards = true;
        AudioFX.play('correct');
        this.emit('stateChanged', { areas: ['hud', 'nav'] });
        return true;
      },

      grantGuardianVictory() {
        const firstTime = !state.guardianDefeated;
        state.guardianDefeated = true;
        if (firstTime) {
          state.shards += 2000;
          state.totalShardsEarned += 2000;
          state.mana.prismatic += 3;
        } else {
          state.shards += 500;
          state.mana.prismatic += 1;
        }
        AudioFX.play('hatch_legendary');
        AudioFX.play('chromatic');
        this.emit('fx', { kind: 'burst', rarity: 'legendary', chromatic: true });
        this.emit('stateChanged', { areas: ['hud', 'nav', 'incubator'] });
        return { firstTime };
      },

      // --- Boucle logique 1 seconde ---
      tick(dtSec) {
        // 1. Production d'Éclats
        const prod = this.getTotalProductionPerSec();
        if (prod > 0) {
          const gained = prod * dtSec;
          state.shards += gained;
          state.totalShardsEarned += gained;
        }

        // 2. Décompte des incubateurs
        let eggJustFinished = false;
        for (const inc of state.incubators) {
          if (inc.egg && inc.egg.remainingSec > 0) {
            inc.egg.remainingSec = Math.max(0, inc.egg.remainingSec - dtSec);
            if (inc.egg.remainingSec === 0) {
              eggJustFinished = true;
              AudioFX.play('correct');
              this.emit('toast', { text: `🥚 Œuf prêt dans l'Incubateur #${inc.id + 1} !`, tone: 'gold' });
            }
          }
        }
        if (eggJustFinished) {
          this.emit('stateChanged', { areas: ['incubator', 'nav'] });
        }

        // 3. Instabilité ADN périodique (~45s) pour la répétition espacée
        const activeStableEnclosures = state.enclosures.filter(
          e => e.unlocked && !e.unstable && e.slots.some(s => s !== null)
        );
        if (activeStableEnclosures.length > 0) {
          state.instabilityTimer -= dtSec;
          if (state.instabilityTimer <= 0) {
            state.instabilityTimer = CONFIG.INSTABILITY_INTERVAL_SEC;
            const target = Utils.randomOf(activeStableEnclosures);
            target.unstable = true;
            AudioFX.play('alert');
            this.emit('toast', { text: `⚠️ ADN instable dans ${target.name} (-50% prod.) !`, tone: 'danger' });
            this.emit('stateChanged', { areas: ['enclosures', 'nav', 'hud'] });
          }
        }
      }
    };

    /* ==========================================================================
       [6. EFFORT BRIDGE]
       Pont unique entre la boucle de jeu et la source d'effort.
       En mode 'PEDAGO' : lance un exercice/flash-quiz adapté.
       En futur mode 'COMMERCIAL' : brancher ici SDK Pub Récompensée ou Gemmes.
       ========================================================================== */
    const EffortBridge = {
      _pedagoHandler: null,

      setPedagoHandler(fn) {
        this._pedagoHandler = fn;
      },

      /**
       * @param {string} actionType - 'EARN_MANA' | 'STABILIZE' | 'ACCELERATE' | 'OVERCHARGE'
       * @param {string} difficulty - 'easy' | 'medium' | 'hard' | 'flash'
       * @param {Function} onSuccess
       * @param {Function} onFail
       */
      requestAction(actionType, difficulty, onSuccess, onFail) {
        if (CONFIG.MODE === 'COMMERCIAL') {
          // ===================================================================
          // POINT DE BRANCHEMENT VERSION COMMERCIALE (Grand Public)
          // Exemple :
          //   if (actionType === 'ACCELERATE') return AdSDK.showRewardedVideo(onSuccess, onFail);
          //   if (actionType === 'OVERCHARGE') return StoreSDK.spendGems(15, onSuccess, onFail);
          // ===================================================================
          if (onSuccess) onSuccess();
          return;
        }

        // Mode PEDAGO : génération d'une question adaptée à l'action
        let question;
        let timeLimitSec = null;
        let title = 'Défi ManaLab';

        if (difficulty === 'flash' || actionType === 'STABILIZE' || actionType === 'ACCELERATE') {
          question = ExerciseGenerators.flashcard(state.questionHistory);
          timeLimitSec = CONFIG.FLASH_QUIZ_SEC;
          title = actionType === 'STABILIZE'
            ? '🧬 Stabilisation ADN (Flash-Quiz Mémoire)'
            : '⚡ Accélération d’Incubation (Flash-Quiz)';
        } else if (actionType === 'OVERCHARGE') {
          question = Math.random() < 0.5 ? ExerciseGenerators.medium() : ExerciseGenerators.hard();
          timeLimitSec = CONFIG.OVERCHARGE_QUIZ_SEC;
          title = '⚡ SURCHARGE : Stop ou Encore !';
        } else {
          question = ExerciseGenerators[difficulty] ? ExerciseGenerators[difficulty]() : ExerciseGenerators.easy();
          const labels = { easy: 'Facile (Mana Brut)', medium: 'Moyen (Mana Pur)', hard: 'Difficile (Mana Prismatique)' };
          title = `🧪 Extraction de Mana — ${labels[difficulty] || ''}`;
        }

        if (this._pedagoHandler) {
          this._pedagoHandler({ title, question, timeLimitSec, actionType, difficulty }, onSuccess, onFail);
        }
      }
    };

    /* ==========================================================================
       [7. RENDER / FX]
       Canvas plein écran 60 FPS : bulles bioluminescentes d'ambiance,
       explosions de particules/confettis et textes flottants (+Mana / +Éclats)
       ========================================================================== */
    const FXRenderer = {
      canvas: null,
      ctx: null,
      width: 0,
      height: 0,
      bubbles: [],
      particles: [],
      floats: [],
      lastTs: 0,

      init() {
        this.canvas = document.getElementById('fx-canvas');
        this.ctx = this.canvas.getContext('2d');
        this.resize();
        window.addEventListener('resize', () => this.resize());
        // Créer des micro-bulles bioluminescentes douces en arrière-plan
        this.bubbles = [];
        for (let i = 0; i < 24; i++) {
          this.bubbles.push({
            x: Math.random() * this.width,
            y: Math.random() * this.height,
            r: 1.5 + Math.random() * 3.5,
            vy: 12 + Math.random() * 22,
            drift: Math.random() * Math.PI * 2,
            color: Math.random() < 0.7 ? 'rgba(46, 242, 224, 0.22)' : 'rgba(56, 189, 248, 0.2)'
          });
        }
      },

      resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.width = window.innerWidth;
        this.height = window.innerHeight;
        this.canvas.width = Math.floor(this.width * dpr);
        this.canvas.height = Math.floor(this.height * dpr);
        this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      },

      spawnBurst(rarity = 'rare', chromatic = false) {
        const cx = this.width / 2;
        const cy = this.height * 0.44;
        const palettes = {
          common: ['#22d39c', '#5eead4', '#a7f3d0'],
          rare: ['#38bdf8', '#2ef2e0', '#bae6fd', '#818cf8'],
          epic: ['#c084fc', '#e879f9', '#38bdf8', '#f3e8ff'],
          legendary: ['#facc15', '#fef08a', '#fb923c', '#2ef2e0', '#ffffff']
        };
        const chromaPalette = ['#ff6b9d', '#facc15', '#2ef2e0', '#38bdf8', '#c084fc', '#ffffff'];
        const colors = chromatic ? chromaPalette : (palettes[rarity] || palettes.rare);
        const count = rarity === 'legendary' || chromatic ? 90 : (rarity === 'epic' ? 60 : (rarity === 'rare' ? 38 : 20));

        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 90 + Math.random() * (rarity === 'legendary' ? 360 : 250);
          this.particles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 90,
            size: 3 + Math.random() * 5,
            color: colors[Math.floor(Math.random() * colors.length)],
            life: 1,
            decay: 0.55 + Math.random() * 0.55,
            rot: Math.random() * Math.PI,
            vrot: (Math.random() - 0.5) * 10
          });
        }
      },

      spawnFloatText(text, x, y) {
        this.floats.push({
          text,
          x: x ?? this.width * 0.5,
          y: y ?? this.height * 0.25,
          vy: -48,
          life: 1
        });
      },

      draw(ts) {
        if (!this.ctx) return;
        const dt = this.lastTs ? Math.min(0.05, (ts - this.lastTs) / 1000) : 0.016;
        this.lastTs = ts;
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.width, this.height);

        // 1. Bulles bioluminescentes d'ambiance
        for (const b of this.bubbles) {
          b.y -= b.vy * dt;
          b.drift += dt * 1.4;
          const bx = b.x + Math.sin(b.drift) * 14;
          if (b.y < -12) {
            b.y = this.height + 12;
            b.x = Math.random() * this.width;
          }
          ctx.beginPath();
          ctx.arc(bx, b.y, b.r, 0, Math.PI * 2);
          ctx.fillStyle = b.color;
          ctx.fill();
        }

        // 2. Particules / Confettis d'éclosion
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.vy += 320 * dt; // Gravité légère
          p.vx *= 0.985;
          p.rot += p.vrot * dt;
          p.life -= p.decay * dt;
          if (p.life <= 0) {
            this.particles.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
          ctx.restore();
        }

        // 3. Textes flottants
        for (let i = this.floats.length - 1; i >= 0; i--) {
          const f = this.floats[i];
          f.y += f.vy * dt;
          f.life -= dt * 0.85;
          if (f.life <= 0) {
            this.floats.splice(i, 1);
            continue;
          }
          ctx.save();
          ctx.globalAlpha = Math.max(0, f.life);
          ctx.font = '800 18px system-ui, sans-serif';
          ctx.textAlign = 'center';
          ctx.fillStyle = '#041321';
          ctx.fillText(f.text, f.x + 1, f.y + 1);
          ctx.fillStyle = '#2ef2e0';
          ctx.fillText(f.text, f.x, f.y);
          ctx.restore();
        }
      }
    };

    /* ==========================================================================
       [8. UI & MODALS]
       Rendu DOM réactif piloté par dirty flags, modales de quiz, d'éclosion
       (Stop ou Encore), de Fusion et du Gardien Alpha
       ========================================================================== */
    const UI = {
      activeTab: 'enclosures',
      dirty: { hud: true, nav: true, enclosures: true, incubator: true, exercises: true, fusion: true, manadex: true },
      _quizInterval: null,
      _modalOpen: false,

      markDirty(areas) {
        for (const a of areas) {
          if (a in this.dirty) this.dirty[a] = true;
        }
      },

      showToast(text, tone = 'cyan') {
        const stack = document.getElementById('toast-stack');
        const el = document.createElement('div');
        el.className = `toast ${tone}`;
        el.textContent = text;
        stack.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transform = 'translateX(20px)';
          el.style.transition = 'all 0.25s ease';
          setTimeout(() => el.remove(), 260);
        }, 3200);
      },

      openModal(html) {
        this._clearQuizTimer();
        const box = document.getElementById('modal-box');
        const backdrop = document.getElementById('modal-backdrop');
        box.innerHTML = html;
        backdrop.classList.add('open');
        this._modalOpen = true;
      },

      closeModal() {
        this._clearQuizTimer();
        document.getElementById('modal-backdrop').classList.remove('open');
        this._modalOpen = false;
      },

      _clearQuizTimer() {
        if (this._quizInterval) {
          clearInterval(this._quizInterval);
          this._quizInterval = null;
        }
      },

      // --- Mise à jour légère à 1 Hz (ne détruit aucun bouton cliquable) ---
      updateLiveTickDisplay() {
        const prod = GameEngine.getTotalProductionPerSec();
        document.getElementById('hud-shards').textContent = Utils.formatNum(state.shards);
        document.getElementById('hud-prod-rate').textContent = `+${prod.toFixed(1).replace(/\.0$/, '')}/s`;

        // Mettre à jour les barres de progression d'incubation en place
        if (this.activeTab === 'incubator') {
          for (const inc of state.incubators) {
            if (!inc.egg) continue;
            const timerEl = document.querySelector(`[data-inc-timer="${inc.id}"]`);
            const barEl = document.querySelector(`[data-inc-bar="${inc.id}"]`);
            if (timerEl && barEl) {
              const pct = Math.min(100, Math.round(((inc.egg.durationSec - inc.egg.remainingSec) / inc.egg.durationSec) * 100));
              timerEl.textContent = inc.egg.remainingSec > 0 ? `${Math.ceil(inc.egg.remainingSec)}s` : 'PRÊT !';
              barEl.style.width = `${pct}%`;
            }
          }
        }
      },

      renderDirty() {
        if (this.dirty.hud) { this.renderHUD(); this.dirty.hud = false; }
        if (this.dirty.nav) { this.renderNavBadges(); this.dirty.nav = false; }
        if (this.activeTab === 'enclosures' && this.dirty.enclosures) { this.renderEnclosures(); this.dirty.enclosures = false; }
        if (this.activeTab === 'incubator' && this.dirty.incubator) { this.renderIncubator(); this.dirty.incubator = false; }
        if (this.activeTab === 'exercises' && this.dirty.exercises) { this.renderExercises(); this.dirty.exercises = false; }
        if (this.activeTab === 'fusion' && this.dirty.fusion) { this.renderFusion(); this.dirty.fusion = false; }
        if (this.activeTab === 'manadex' && this.dirty.manadex) { this.renderManaDex(); this.dirty.manadex = false; }
      },

      renderHUD() {
        const prod = GameEngine.getTotalProductionPerSec();
        document.getElementById('hud-shards').textContent = Utils.formatNum(state.shards);
        document.getElementById('hud-prod-rate').textContent = `+${prod.toFixed(1).replace(/\.0$/, '')}/s`;
        document.getElementById('hud-mana-raw').textContent = state.mana.raw;
        document.getElementById('hud-mana-pure').textContent = state.mana.pure;
        document.getElementById('hud-mana-prismatic').textContent = state.mana.prismatic;

        const chromaPct = Math.round(ProbaEngine.getChromaticChance() * 100);
        const streakBonusPct = Math.round((ProbaEngine.getChromaticChance() - CONFIG.CHROMATIC_CHANCE) * 100);
        document.getElementById('hud-streak').textContent = state.streak;
        document.getElementById('hud-chroma-chance').textContent = `Chroma ${chromaPct}%`;
        document.getElementById('hud-streak-bonus').textContent = `(+${streakBonusPct}% Chroma)`;

        document.getElementById('hud-dex-count').textContent = `${GameEngine.getDiscoveredCount()} / ${SPECIES_LIST.length}`;
        document.getElementById('hud-dex-chroma').textContent = `(${GameEngine.getChromaticDiscoveredCount()} 🌈)`;
        document.getElementById('hud-pity-mini').textContent = `Chance ${state.pity}%`;

        document.getElementById('btn-sound').textContent = state.soundEnabled ? '🔊 Son : ON' : '🔇 Son : OFF';
        document.getElementById('hud-victory-badge').style.display = state.guardianDefeated ? 'inline' : 'none';
      },

      renderNavBadges() {
        const unstableCount = state.enclosures.filter(e => e.unlocked && e.unstable).length;
        const bEnc = document.getElementById('badge-enclosures');
        bEnc.style.display = unstableCount > 0 ? 'grid' : 'none';
        bEnc.textContent = unstableCount;

        const readyEggs = state.incubators.filter(i => i.unlocked && i.egg && i.egg.remainingSec <= 0).length;

        const gBtn = document.getElementById('btn-guardian-tab');
        gBtn.classList.toggle('won', state.guardianDefeated);
      },

        const reserve = GameEngine.getReserveSpecimens();

            </div>`

              ${reserve.map(sp => {
                const def = SPECIES[sp.speciesId];
                return `<div class="specimen-card ${sp.chromatic ? 'chromatic-card' : ''}">

      // --- ONGLET 2 : INCUBATEUR & PROBABILITÉS ---
      renderIncubator() {
        const container = document.getElementById('tab-incubator');
        const sel = state.manaSelection;
        const totalSel = sel.raw + sel.pure + sel.prismatic;
        const odds = ProbaEngine.computeOdds(sel);
        const chromaPct = Math.round(ProbaEngine.getChromaticChance() * 100);
        const freeInc = state.incubators.find(i => i.unlocked && !i.egg);
        const nextLockedInc = state.incubators.find(i => !i.unlocked);

        const manaControls = [
          { key: 'raw', label: 'Mana Brut', badge: 'mana-raw', desc: 'Facile • -9% Commun → +Rare', stock: state.mana.raw },
          { key: 'pure', label: 'Mana Pur', badge: 'mana-pure', desc: 'Moyen • -18% Commun → +Rare/Épique', stock: state.mana.pure },
          { key: 'prismatic', label: 'Mana Prismatique', badge: 'mana-prismatic', desc: 'Difficile • -30% Commun → +Épique/Lég.', stock: state.mana.prismatic }
        ].map(m => `
          <div class="mana-control">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span class="mana-badge ${m.badge}">${m.label}</span>
              <span style="font-size:0.78rem;color:var(--text-muted);">Stock : <strong>${m.stock}</strong></span>
            </div>
            <div style="font-size:0.74rem;color:var(--text-dim);">${m.desc}</div>
            <div class="mana-stepper">
              <button class="stepper-btn" data-action="mana-step" data-mana="${m.key}" data-delta="-1" ${sel[m.key] <= 0 ? 'disabled' : ''}>−</button>

              <button class="stepper-btn" data-action="mana-step" data-mana="${m.key}" data-delta="1" ${(sel[m.key] >= m.stock || totalSel >= CONFIG.MAX_MANA_PER_EGG) ? 'disabled' : ''}>+</button>
            </div>
          </div>
        `).join('');

        const podsHtml = state.incubators.filter(i => i.unlocked).map(inc => {
          if (!inc.egg) {
            return `<div class="incubator-pod">
              <div style="font-weight:800;font-size:0.92rem;">Incubateur #${inc.id + 1}</div>
              <div style="text-align:center;padding:16px 0;color:var(--text-dim);font-size:0.84rem;">
                Vide — Prêt à recevoir un œuf mutant.
              </div>
            </div>`;
          }
          const ready = inc.egg.remainingSec <= 0;
          const pct = Math.min(100, Math.round(((inc.egg.durationSec - inc.egg.remainingSec) / inc.egg.durationSec) * 100));
          const o = inc.egg.odds;
          return `<div class="incubator-pod ${ready ? 'ready' : ''}">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <span style="font-weight:800;font-size:0.92rem;">Incubateur #${inc.id + 1}</span>
              <span class="biome-pill" data-inc-timer="${inc.id}">${ready ? 'PRÊT !' : Math.ceil(inc.egg.remainingSec) + 's'}</span>
            </div>
            <div class="egg-visual ${ready ? 'egg-wobble' : ''}">${getEggSVG(inc.egg.overchargeWon)}</div>
            <div style="font-size:0.74rem;color:var(--text-muted);text-align:center;">
              C:${o.common}% • R:${o.rare}% • É:${o.epic}% • L:${o.legendary}%
            </div>
            <div class="progress-track">
              <div class="progress-fill" data-inc-bar="${inc.id}" style="width:${pct}%;background:${ready ? 'linear-gradient(90deg,#facc15,#fef08a)' : 'linear-gradient(90deg,#14b8a6,#38bdf8)'};"></div>
            </div>
            ${ready
              ? `<button class="btn btn-gold" data-action="open-hatch-modal" data-inc="${inc.id}">✨ Ouvrir / Surcharger l'Œuf</button>`
              : `<button class="btn btn-sm btn-purple" data-action="accelerate-egg" data-inc="${inc.id}">⚡ Accélérer (Flash-Quiz 10s)</button>`}
          </div>`;
        }).join('');

        container.innerHTML = `
          <div class="panel">
            <div class="panel-header">
              <div>
                <div class="panel-title">🧪 Synthèse & Probabilités en Direct</div>
                <div class="panel-desc">Injecte jusqu'à ${CONFIG.MAX_MANA_PER_EGG} doses de Mana pour manipuler les pourcentages avant d'incuber.</div>
              </div>
              <span class="chromatic-badge">🌈 Chance Chromatique : ${chromaPct}%</span>
            </div>

            <div class="proba-bar-wrap">
              <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
                <strong style="font-size:0.88rem;">
                  ${odds.pityTriggered ? '🔥 JAUGE DE CHANCE À 100% : Épique ou Légendaire GARANTI !' : `Distribution de l'œuf (${totalSel}/${CONFIG.MAX_MANA_PER_EGG} doses injectées)`}
                </strong>
                <span style="font-size:0.76rem;color:var(--text-muted);">Total exact : 100%</span>
              </div>

              <div class="proba-bar-track">
                <div class="proba-seg common" style="width:${odds.common}%">${odds.common >= 11 ? odds.common + '%' : ''}</div>
                <div class="proba-seg rare" style="width:${odds.rare}%">${odds.rare >= 11 ? odds.rare + '%' : ''}</div>
                <div class="proba-seg epic" style="width:${odds.epic}%">${odds.epic >= 9 ? odds.epic + '%' : ''}</div>
                <div class="proba-seg legendary" style="width:${odds.legendary}%">${odds.legendary >= 8 ? odds.legendary + '%' : ''}</div>
              </div>

              <div class="proba-legend">
                <div class="proba-legend-item"><span class="rarity-pill rar-common">Commun</span><strong>${odds.common}%</strong></div>
                <div class="proba-legend-item"><span class="rarity-pill rar-rare">Rare</span><strong>${odds.rare}%</strong></div>
                <div class="proba-legend-item"><span class="rarity-pill rar-epic">Épique</span><strong>${odds.epic}%</strong></div>
                <div class="proba-legend-item"><span class="rarity-pill rar-legendary">Légendaire</span><strong>${odds.legendary}%</strong></div>
              </div>

              <div class="pity-bar-wrap">
                <div style="display:flex;justify-content:space-between;font-size:0.78rem;">
                  <span>🍀 <strong>Jauge de Chance Garantie (Pity)</strong> : +10% par Commun tiré</span>
                  <strong style="color:#facc15;">${state.pity}% / 100%</strong>
                </div>
                <div class="progress-track">
                  <div class="progress-fill" style="width:${state.pity}%;background:linear-gradient(90deg,#c084fc,#facc15);"></div>
                </div>
              </div>
            </div>

            <div class="mana-selector-grid">${manaControls}</div>

            <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;">
              <button class="btn btn-lg btn-primary" data-action="start-incubation" ${(!freeInc || totalSel === 0) ? 'disabled' : ''}>
                🥚 Lancer l'Incubation (${Math.round(CONFIG.INCUBATION_BASE_SEC + totalSel * CONFIG.INCUBATION_PER_MANA_SEC)}s)
              </button>
              ${totalSel === 0 ? `<button class="btn btn-sm btn-ghost" data-action="goto-tab" data-target="exercises">⚡ Faire un exercice pour gagner du Mana</button>` : ''}
            </div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <div>
                <div class="panel-title">🥚 Cuves d'Incubation</div>
                <div class="panel-desc">Quand un œuf est prêt, tu peux l'ouvrir ou risquer une <strong>Surcharge (Stop ou Encore)</strong> !</div>
              </div>
              ${nextLockedInc ? `
                <button class="btn btn-sm btn-gold" data-action="unlock-incubator" data-inc="${nextLockedInc.id}" ${state.shards >= CONFIG.INCUBATOR_COSTS[nextLockedInc.id] ? '' : 'disabled'}>
                  🔓 Incubateur #${nextLockedInc.id + 1} (${Utils.formatNum(CONFIG.INCUBATOR_COSTS[nextLockedInc.id])} ✦)
                </button>` : ''}
            </div>
            <div class="incubators-list">${podsHtml}</div>
          </div>
        `;
      },

              </div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <span class="biome-pill">Précision : ${accuracy}%</span>
                <span class="chromatic-badge">🔥 Série ${state.streak} → Chroma ${chromaPct}%</span>

            </div>

            <div class="exercise-tiers">
              <div class="tier-card easy">

                  <h3 style="margin:8px 0 4px;">Pourcentages & Probas Simples</h3>
                  <p style="font-size:0.83rem;color:var(--text-muted);">10%, 25%, 50%, 75%, multiplications et tirages de probabilités simples.</p>
                </div>
                <div style="font-size:0.82rem;color:#bae6fd;">
                  Récompense : <strong>+1 Mana Pur ◆</strong> + 18 ✦

                <button class="btn btn-primary" data-action="start-exercise" data-diff="medium">▶ Lancer (Moyen)</button>

                  <p style="font-size:0.83rem;color:var(--text-muted);">Retrouver 100%, événements complémentaires, unions et tirages indépendants.</p>
                </div>
                <div style="font-size:0.82rem;color:#f3e8ff;">
                  Récompense : <strong>+1 Mana Prismatique ★</strong> + 35 ✦
                </div>
                <button class="btn btn-purple" data-action="start-exercise" data-diff="hard">▶ Lancer (Difficile)</button>
              </div>
            </div>

            <div style="margin-top:14px;padding:12px;border-radius:var(--radius-sm);background:rgba(46,242,224,0.08);border:1px solid rgba(46,242,224,0.22);font-size:0.82rem;color:#cde8f5;">
              🔥 <strong>Règle de Série (Combo) :</strong> Chaque bonne réponse d'affilée ajoute <strong>+5% de chance Chromatique</strong> (spécimen arc-en-ciel valant <strong>×3</strong>), et chaque palier de 3 réussites offre <strong>+1 dose de Mana bonus</strong> ! Attention : une erreur remet le combo à 0.
            </div>
          </div>
        `;
      },

      // --- ONGLET 4 : FUSION RISQUÉE ---
      renderFusion() {
        const container = document.getElementById('tab-fusion');
        const groups = GameEngine.getFusableGroups();

        // Vérifier aussi s'il y a des doublons placés en enclos pour aider le joueur
        const allCounts = {};
        Object.values(state.specimens).forEach(sp => {
          if (SPECIES[sp.speciesId].rarity === 'legendary') return;
          allCounts[sp.speciesId] = (allCounts[sp.speciesId] || 0) + 1;
        });
        const placedDuplicates = Object.entries(allCounts)
          .filter(([id, cnt]) => cnt >= 2 && !groups.some(g => g.speciesDef.id === id))
          .map(([id]) => SPECIES[id].name);

        const listHtml = groups.length === 0
          ? `<div style="text-align:center;padding:24px;color:var(--text-muted);font-size:0.88rem;">
              Tu as besoin d'au moins <strong>2 doublons identiques en réserve</strong> (Commun, Rare ou Épique) pour tenter une fusion.
              ${placedDuplicates.length > 0 ? `<div style="margin-top:10px;color:#facc15;">💡 Tu possèdes des doublons de <strong>${placedDuplicates.join(', ')}</strong> actuellement placés en enclos : retire-les vers la réserve pour les fusionner !</div>` : ''}
            </div>`
          : `<div class="fusion-grid">
              ${groups.map(g => {
                const def = g.speciesDef;
                const nextRar = CONFIG.RARITY_ORDER[CONFIG.RARITY_ORDER.indexOf(def.rarity) + 1];
                const canSafe = g.list.length >= CONFIG.FUSION_SAFE_COUNT;
                return `<div class="fusion-card">
                  <div style="display:flex;align-items:center;gap:12px;">
                    <div class="creature-svg-sm">${getSpeciesSVG(def.id, false)}</div>
                    <div>
                      <div style="font-weight:800;">${def.name}</div>
                      <div style="font-size:0.78rem;color:var(--text-muted);">En réserve : <strong style="color:#fff;">×${g.list.length}</strong></div>
                      <div style="margin-top:4px;display:flex;align-items:center;gap:6px;">
                        <span class="rarity-pill rar-${def.rarity}">${CONFIG.RARITY_LABELS[def.rarity]}</span>
                        <span>→</span>
                        <span class="rarity-pill rar-${nextRar}">${CONFIG.RARITY_LABELS[nextRar]}</span>
                      </div>
                    </div>
                  </div>
                  <div style="display:flex;flex-direction:column;gap:8px;margin-top:4px;">
                    <button class="btn btn-primary" data-action="fuse" data-species="${def.id}" data-mode="safe" ${canSafe ? '' : 'disabled'}>
                      🛡️ Fusion Sûre : 3 doublons (100% réussite)
                    </button>
                    <button class="btn btn-purple" data-action="fuse" data-species="${def.id}" data-mode="risky">
                      🎲 Fusion Risquée : 2 doublons (65% réussite / 35% perte)
                    </button>
                  </div>
                </div>`;
              }).join('')}
            </div>`;

        container.innerHTML = `
          <div class="panel">
            <div class="panel-header">
              <div>
                <div class="panel-title">🧬 Chambre de Fusion Probabiliste</div>
                <div class="panel-desc">Compare l'espérance de gain : sécurise avec 3 doublons (100%) ou tente le risque avec 2 doublons (65% succès, 35% de perdre 1 spécimen) !</div>
              </div>
            </div>
            ${listHtml}
          </div>
        `;
      },

      renderManaDex() {
        const container = document.getElementById('tab-manadex');
        const discovered = GameEngine.getDiscoveredCount();
        const pct = Math.round((discovered / SPECIES_LIST.length) * 100);

        const cardsHtml = SPECIES_LIST.map(def => {
          const entry = state.manadex[def.id];
          const found = !!(entry && entry.discovered);
          const chroma = !!(entry && entry.chromatic);
          return `<div class="dex-card ${found ? '' : 'locked'} ${chroma ? 'chromatic-card' : ''}">
            <div class="creature-svg-md">${getSpeciesSVG(def.id, chroma)}</div>
            <div style="font-weight:800;font-size:0.94rem;">${found ? def.name : '??? Spécimen Inconnu'}</div>
            <div style="display:flex;gap:4px;flex-wrap:wrap;justify-content:center;">
              <span class="rarity-pill rar-${def.rarity}">${CONFIG.RARITY_LABELS[def.rarity]}</span>
              <span class="type-pill">${def.type}</span>
              ${chroma ? '<span class="chromatic-badge">🌈 Chroma</span>' : ''}

      // --- MODALE DE QUIZ (branchée dans EffortBridge) ---
      openQuizModal(config, onSuccess, onFail) {
        const { title, question, timeLimitSec } = config;
        let answered = false;

        this.openModal(`
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
            <div style="font-weight:800;font-size:1rem;color:var(--accent-cyan);">${title}</div>
            ${timeLimitSec ? `<span id="quiz-sec-left" class="biome-pill">${timeLimitSec}s</span>` : '<span class="biome-pill">Sans chrono</span>'}
          </div>
          ${question.isReview ? '<div style="margin-top:6px;font-size:0.76rem;color:#fef08a;">🧠 Question de répétition espacée (déjà rencontrée)</div>' : ''}
          ${timeLimitSec ? `<div class="quiz-timer-track"><div id="quiz-timer-fill" class="quiz-timer-fill" style="width:100%;"></div></div>` : '<div style="height:10px;"></div>'}
          <div class="quiz-question-box">${question.prompt}</div>
          <div class="quiz-choices">
            ${question.choices.map((ch, idx) => `<button class="quiz-choice-btn" data-choice="${idx}">${ch}</button>`).join('')}
          </div>
          <div id="quiz-feedback" class="quiz-feedback"></div>
        `);

        const finish = (isCorrect, timedOut = false) => {
          if (answered) return;
          answered = true;
          this._clearQuizTimer();
          GameEngine.recordQuestionResult(question, isCorrect);

          const btns = document.querySelectorAll('#modal-box .quiz-choice-btn');
          btns.forEach((b, i) => {
            b.disabled = true;
            if (i === question.answerIndex) b.classList.add('correct');
          });

          const fb = document.getElementById('quiz-feedback');
          fb.className = `quiz-feedback show ${isCorrect ? 'ok' : 'ko'}`;
          fb.innerHTML = isCorrect
            ? `✅ <strong>Bravo !</strong> ${question.explain}`
            : `❌ <strong>${timedOut ? 'Temps écoulé !' : 'Raté !'}</strong> ${question.explain}`;

          AudioFX.play(isCorrect ? 'correct' : 'wrong');

          setTimeout(() => {
            this.closeModal();
            if (isCorrect) { if (onSuccess) onSuccess(); }
            else { if (onFail) onFail(); }
            this.renderDirty();
          }, 1350);
        };

        document.querySelectorAll('#modal-box .quiz-choice-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.dataset.choice);
            if (idx !== question.answerIndex) btn.classList.add('wrong');
            finish(idx === question.answerIndex, false);
          });
        });

        if (timeLimitSec) {
          const start = Date.now();
          const totalMs = timeLimitSec * 1000;
          this._quizInterval = setInterval(() => {
            const leftMs = Math.max(0, totalMs - (Date.now() - start));
            const pct = (leftMs / totalMs) * 100;
            const bar = document.getElementById('quiz-timer-fill');
            const lbl = document.getElementById('quiz-sec-left');
            if (bar) {
              bar.style.width = `${pct}%`;
              if (pct < 30) bar.classList.add('danger');
            }
            if (lbl) lbl.textContent = `${Math.ceil(leftMs / 1000)}s`;
            if (leftMs <= 0) finish(false, true);
          }, 80);
        }
      },
