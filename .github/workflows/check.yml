name: Vérifications ManaLab
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntaxe JS
        run: for f in js/*.js sw.js; do node --check "$f"; done
      - name: Tests (probabilités, exercices, sauvegardes, cache sw.js)
        run: node tests/run.js
